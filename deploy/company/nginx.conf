events { worker_connections 1024; }
http {
    # Log only routing metadata, never query strings, headers or bodies.
    log_format metadata '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log metadata;
    server_tokens off;
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # The employee API is intentionally reachable through the public HTTPS
        # endpoint. Management routes remain protected by the gateway's admin
        # secret; add a location-specific allow/deny policy if VPN-only admin
        # access is required later.
        location /v1/ {
            # Model payload limits are decided by the upstream, not this proxy.
            client_max_body_size 0;
            proxy_pass http://gateway:8317;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
        }
        location / {
            proxy_pass http://gateway:8317;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
        }
    }
}
