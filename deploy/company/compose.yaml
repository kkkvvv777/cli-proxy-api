services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/company/Dockerfile
    image: company-cli-proxy-api:local
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/settings/config.yaml", "-local-model"]
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?Set MANAGEMENT_PASSWORD in .env}
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/company-panel
    volumes:
      - ./runtime/settings:/CLIProxyAPI/settings
      - ./runtime/auths:/CLIProxyAPI/auths
      - ./runtime/logs:/CLIProxyAPI/logs
      - ./runtime/data:/CLIProxyAPI/data
      - ./runtime/plugins:/CLIProxyAPI/plugins
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [gateway]
  edge:
    image: nginx:stable
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/tls:/etc/nginx/tls:ro
    depends_on: [gateway]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [gateway]
networks:
  gateway:
    driver: bridge
